<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TIBRO LOOK · Live Detection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-0: #07090d;
      --bg-1: #0d1117;
      --bg-2: #151b24;
      --border: #1f2632;
      --border-strong: #2c3543;
      --text: #d6dbe3;
      --text-dim: #6b7589;
      --text-faint: #3d4554;
      --accent: #62d4ff;
      --accent-soft: rgba(98, 212, 255, 0.12);
      --good: #5dd39e;
      --warn: #f3a953;
      --bad: #f06e6e;
      --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
      --display: 'Space Grotesk', system-ui, sans-serif;
    }

    html, body { height: 100%; }

    body {
      background:
        radial-gradient(1200px 800px at 80% -10%, rgba(98, 212, 255, 0.06), transparent 60%),
        radial-gradient(1000px 700px at -10% 110%, rgba(243, 169, 83, 0.04), transparent 60%),
        var(--bg-0);
      color: var(--text);
      font-family: var(--mono);
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      padding: 1rem 1.75rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 1.5rem;
      background: rgba(13, 17, 23, 0.6);
      backdrop-filter: blur(8px);
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      font-family: var(--display);
    }

    .brand .mark {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: var(--accent);
    }

    .brand .name {
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      color: var(--text);
    }

    .brand .sub {
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .header-meta {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .capture-wrap {
      display: flex;
      align-items: center;
    }

    #captureBtn {
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--accent);
      font-family: var(--display);
      font-size: 1rem;
      letter-spacing: 0.16em;
      padding: 0.55rem 1rem;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: color 0.15s, border-color 0.15s, transform 0.15s;
    }

    #captureBtn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--accent);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.18s ease;
    }

    #captureBtn:hover::before { transform: scaleX(1); }
    #captureBtn:hover { color: #000; }
    #captureBtn:active { transform: scale(0.98); }
    #captureBtn span { position: relative; z-index: 1; }
    #captureBtn.loading {
      pointer-events: none;
      border-color: var(--text-dim);
      color: var(--text-dim);
    }
    #captureBtn.loading::before { transform: scaleX(0) !important; }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-faint);
      box-shadow: 0 0 0 0 transparent;
      transition: background-color 0.3s, box-shadow 0.3s;
    }

    .status-dot.live {
      background: var(--good);
      box-shadow: 0 0 10px rgba(93, 211, 158, 0.6);
      animation: pulse 1.8s ease-in-out infinite;
    }

    .status-dot.stale {
      background: var(--warn);
      box-shadow: 0 0 8px rgba(243, 169, 83, 0.5);
    }

    .status-dot.down {
      background: var(--bad);
      box-shadow: 0 0 8px rgba(240, 110, 110, 0.5);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }

    .clock {
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.08em;
      color: var(--text);
    }

    /* ── Stage ── */
    main {
      position: relative;
      display: grid;
      place-items: center;
      padding: 2rem;
      overflow: hidden;
    }

    .frame-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
    }

    .frame {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 6px;
      border: 1px solid var(--border-strong);
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.6),
        0 30px 80px rgba(0, 0, 0, 0.55),
        0 0 60px rgba(98, 212, 255, 0.05);
      opacity: 0;
      transition: opacity 0.25s ease;
      background: var(--bg-1);
    }

    .frame.loaded { opacity: 1; }

    .corner {
      position: absolute;
      width: 22px;
      height: 22px;
      border-color: var(--accent);
      pointer-events: none;
      opacity: 0.85;
    }
    .corner.tl { top: -1px; left: -1px; border-top: 2px solid; border-left: 2px solid; }
    .corner.tr { top: -1px; right: -1px; border-top: 2px solid; border-right: 2px solid; }
    .corner.bl { bottom: -1px; left: -1px; border-bottom: 2px solid; border-left: 2px solid; }
    .corner.br { bottom: -1px; right: -1px; border-bottom: 2px solid; border-right: 2px solid; }

    /* Empty state */
    .empty {
      text-align: center;
      color: var(--text-dim);
      font-family: var(--display);
      letter-spacing: 0.1em;
    }
    .empty .glyph {
      font-family: var(--mono);
      font-size: 3rem;
      color: var(--text-faint);
      margin-bottom: 1rem;
      letter-spacing: 0.05em;
    }
    .empty p {
      font-size: 0.85rem;
      text-transform: uppercase;
    }

    /* ── Footer ── */
    footer {
      border-top: 1px solid var(--border);
      background: rgba(13, 17, 23, 0.6);
      backdrop-filter: blur(8px);
      padding: 0.9rem 1.75rem;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 1.5rem;
      align-items: center;
      min-height: 64px;
    }

    .meta {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      color: var(--text-dim);
      text-transform: uppercase;
      white-space: nowrap;
    }

    .meta .big {
      font-family: var(--display);
      font-size: 1.15rem;
      letter-spacing: 0.06em;
      color: var(--text);
      text-transform: none;
    }

    .meta.secondary .big {
      color: var(--warn);
    }

    .meta-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .reset-btn {
      border: 1px solid var(--border-strong);
      background: transparent;
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 0.45rem 0.7rem;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }

    .reset-btn:hover {
      border-color: var(--warn);
      color: var(--warn);
      background: rgba(243, 169, 83, 0.08);
    }

    .reset-btn:active {
      transform: translateY(1px);
    }

    .reset-btn.loading {
      pointer-events: none;
      opacity: 0.6;
    }

    .detections {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border-strong) transparent;
      padding-bottom: 2px;
    }
    .detections::-webkit-scrollbar { height: 4px; }
    .detections::-webkit-scrollbar-track { background: transparent; }
    .detections::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.7rem;
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      font-size: 0.72rem;
      letter-spacing: 0.05em;
      color: var(--text);
      background: var(--bg-1);
      white-space: nowrap;
      animation: chip-in 0.25s ease;
    }

    @keyframes chip-in {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .chip .swatch {
      width: 8px;
      height: 8px;
      border-radius: 2px;
    }

    .chip .label {
      font-weight: 500;
      text-transform: capitalize;
    }

    .chip .conf {
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
    }

    .chip-empty {
      color: var(--text-faint);
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .source {
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      color: var(--text-dim);
      text-transform: uppercase;
      text-align: right;
      white-space: nowrap;
    }
    .source strong { color: var(--accent); font-weight: 500; letter-spacing: 0.08em; }

    @media (max-width: 720px) {
      footer { grid-template-columns: 1fr; }
      .source { text-align: left; }
      .header-meta { gap: 0.8rem; font-size: 0.65rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <span class="mark">◉</span>
    <span class="name">TIBRO LOOK</span>
    <span class="sub">// Live Detection Feed</span>
  </div>
  <div class="header-meta">
    <div class="capture-wrap">
      <button id="captureBtn" type="button"><span>SHOOT</span></button>
    </div>
    <span class="status">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">CONNECTING</span>
    </span>
    <span class="clock" id="clock">--:--:--</span>
  </div>
</header>

<main>
  <div class="frame-wrap" id="frameWrap">
    <div class="empty" id="emptyState">
      <div class="glyph">◌</div>
      <p>Waiting for first frame</p>
    </div>
    <img id="frame" class="frame" alt="Latest detection" />
    <span class="corner tl"></span>
    <span class="corner tr"></span>
    <span class="corner bl"></span>
    <span class="corner br"></span>
  </div>
</main>

<footer>
  <div class="meta">
    <span class="big" id="objCount">—</span>
    <span id="objLabel">objects · waiting</span>
  </div>

  <div class="meta secondary">
    <div class="meta-row">
      <span class="big" id="metalCount">0</span>
      <button class="reset-btn" id="metalResetBtn" type="button">Reset</button>
    </div>
    <span id="metalLabel">metal hits</span>
  </div>

  <div class="detections" id="detList">
    <span class="chip-empty">No detections yet</span>
  </div>

  <div class="source">
    src · <strong id="srcText">—</strong>
  </div>
</footer>

<script>
  const POLL_MS = 500;
  const STALE_AFTER_MS = 3000;
  const DOWN_AFTER_MS = 10000;

  const frameEl = document.getElementById('frame');
  const emptyEl = document.getElementById('emptyState');
  const cornerEls = document.querySelectorAll('.corner');
  const dotEl = document.getElementById('statusDot');
  const statusTextEl = document.getElementById('statusText');
  const clockEl = document.getElementById('clock');
  const objCountEl = document.getElementById('objCount');
  const objLabelEl = document.getElementById('objLabel');
  const metalCountEl = document.getElementById('metalCount');
  const metalLabelEl = document.getElementById('metalLabel');
  const metalResetBtn = document.getElementById('metalResetBtn');
  const detListEl = document.getElementById('detList');
  const srcEl = document.getElementById('srcText');
  const captureBtn = document.getElementById('captureBtn');

  let lastServerTimestamp = null;
  let lastSeenAt = 0;
  let lastImageLoadedAt = 0;
  let firstFrameShown = false;
  let lastMetalCount = 0;

  // Hide corner markers until a frame is displayed.
  cornerEls.forEach(c => c.style.display = 'none');

  // Clock
  function tickClock() {
    const d = new Date();
    clockEl.textContent = d.toTimeString().slice(0, 8);
  }
  tickClock();
  setInterval(tickClock, 1000);

  // Deterministic color per label
  function labelColor(label) {
    let hash = 0;
    for (const c of label) hash = ((hash << 5) - hash + c.charCodeAt(0)) | 0;
    const hue = Math.abs(hash) % 360;
    return `hsl(${hue}, 70%, 62%)`;
  }

  function setStatus(state, text) {
    dotEl.classList.remove('live', 'stale', 'down');
    if (state) dotEl.classList.add(state);
    statusTextEl.textContent = text;
  }

  function updateStatus() {
    const age = Date.now() - lastSeenAt;
    if (!lastSeenAt) {
      setStatus(null, 'CONNECTING');
    } else if (age < STALE_AFTER_MS) {
      setStatus('live', 'LIVE');
    } else if (age < DOWN_AFTER_MS) {
      setStatus('stale', `STALE · ${Math.floor(age / 1000)}s`);
    } else {
      setStatus('down', 'NO SIGNAL');
    }
  }

  function formatAge(ms) {
    if (ms < 1500) return 'just now';
    if (ms < 60000) return `${Math.floor(ms / 1000)}s ago`;
    return `${Math.floor(ms / 60000)}m ago`;
  }

  function renderDetections(detections) {
    detListEl.innerHTML = '';
    if (!detections || detections.length === 0) {
      const span = document.createElement('span');
      span.className = 'chip-empty';
      span.textContent = 'No objects detected';
      detListEl.appendChild(span);
      return;
    }
    detections.forEach(d => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      const color = labelColor(d.label);
      const conf = Math.round((d.confidence ?? 0) * 100);
      chip.innerHTML = `
        <span class="swatch" style="background:${color}"></span>
        <span class="label">${d.label}</span>
        <span class="conf">${conf}%</span>
      `;
      detListEl.appendChild(chip);
    });
  }

  async function captureImage() {
    if (captureBtn.classList.contains('loading')) return;

    captureBtn.classList.add('loading');
    captureBtn.querySelector('span').textContent = 'CAPTURING';
    try {
      const res = await fetch('/capture', { method: 'POST' });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.success) {
        throw new Error(data.error || `Capture failed (${res.status})`);
      }

      lastServerTimestamp = null;
      await poll();
    } catch (err) {
      statusTextEl.textContent = `CAPTURE ERROR`;
      console.error(err);
    } finally {
      captureBtn.classList.remove('loading');
      captureBtn.querySelector('span').textContent = 'SHOOT';
    }
  }

  async function resetMetalCount() {
    if (metalResetBtn.classList.contains('loading')) return;

    metalResetBtn.classList.add('loading');
    try {
      const res = await fetch('/api/metal/reset', { method: 'POST' });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.success) {
        throw new Error(data.error || `Reset failed (${res.status})`);
      }

      lastMetalCount = 0;
      metalCountEl.textContent = '0';
      metalLabelEl.textContent = 'metal hits';
    } catch (err) {
      console.error(err);
      metalLabelEl.textContent = 'reset failed';
    } finally {
      metalResetBtn.classList.remove('loading');
    }
  }

  captureBtn.addEventListener('click', captureImage);
  metalResetBtn.addEventListener('click', resetMetalCount);
  window.addEventListener('keydown', (event) => {
    if (event.code === 'Space' && !event.repeat) {
      event.preventDefault();
      captureImage();
    }
  });

  function refreshImage() {
    // Cache-bust with the server timestamp so the browser refetches.
    const url = `/latest_detected.jpg?t=${lastServerTimestamp}`;
    const next = new Image();
    next.onload = () => {
      frameEl.src = next.src;
      if (!firstFrameShown) {
        frameEl.classList.add('loaded');
        emptyEl.style.display = 'none';
        cornerEls.forEach(c => c.style.display = '');
        firstFrameShown = true;
      }
      lastImageLoadedAt = Date.now();
    };
    next.onerror = () => { /* swallow — keep showing previous frame */ };
    next.src = url;
  }

  async function poll() {
    try {
      const res = await fetch('/api/latest', { cache: 'no-store' });
      const data = await res.json();

      if (data && typeof data.metal_count === 'number') {
        lastMetalCount = data.metal_count;
        metalCountEl.textContent = lastMetalCount;
        metalLabelEl.textContent = `${lastMetalCount === 1 ? 'hit' : 'hits'} total`;
      }

      if (data && data.success && data.timestamp) {
        lastSeenAt = Date.now();
        if (data.timestamp !== lastServerTimestamp) {
          lastServerTimestamp = data.timestamp;
          refreshImage();
          renderDetections(data.detections || []);

          const n = (data.detections || []).length;
          objCountEl.textContent = n;
          objLabelEl.textContent = `${n === 1 ? 'object' : 'objects'} detected`;
          srcEl.textContent = (data.source || 'unknown').toUpperCase();
        }
      }
    } catch (e) { /* swallow — status will degrade naturally */ }
    updateStatus();

    // Update the "ago" text on the obj label so it feels alive
    if (firstFrameShown && lastImageLoadedAt) {
      const age = Date.now() - lastImageLoadedAt;
      const n = detListEl.querySelectorAll('.chip').length;
      objLabelEl.textContent = `${n === 1 ? 'object' : 'objects'} · ${formatAge(age)}`;
    }
  }

  setInterval(poll, POLL_MS);
  poll();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PiCam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --panel: #141414;
      --border: #2a2a2a;
      --accent: #e8ff00;
      --accent2: #ff4400;
      --text: #c8c8c8;
      --dim: #555;
      --mono: 'Share Tech Mono', monospace;
      --display: 'Bebas Neue', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow-x: hidden;
    }

    /* Scanline overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.07) 2px,
        rgba(0,0,0,0.07) 4px
      );
      pointer-events: none;
      z-index: 999;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding: 1.2rem 2rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .logo {
      font-family: var(--display);
      font-size: 2.4rem;
      letter-spacing: 0.08em;
      color: #fff;
      line-height: 1;
    }

    .logo span { color: var(--accent); }

    .status-bar {
      margin-left: auto;
      display: flex;
      gap: 1.5rem;
      align-items: center;
      font-size: 0.7rem;
      color: var(--dim);
      letter-spacing: 0.1em;
    }

    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    main {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 0;
      height: calc(100vh - 70px - 36px);
    }

    /* ── LEFT PANEL ── */
    .controls {
      border-right: 1px solid var(--border);
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .section-label {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      color: var(--dim);
      text-transform: uppercase;
      margin-bottom: 0.8rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--border);
    }

    /* Capture button */
    #captureBtn {
      width: 100%;
      background: transparent;
      border: 2px solid var(--accent);
      color: var(--accent);
      font-family: var(--display);
      font-size: 1.8rem;
      letter-spacing: 0.15em;
      padding: 1rem 0;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: color 0.15s, background 0.15s;
    }

    #captureBtn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--accent);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.2s ease;
    }

    #captureBtn:hover::before { transform: scaleX(1); }
    #captureBtn:hover { color: #000; }
    #captureBtn:active { transform: scale(0.98); }

    #captureBtn span { position: relative; z-index: 1; }

    #captureBtn.loading {
      pointer-events: none;
      border-color: var(--dim);
      color: var(--dim);
    }
    #captureBtn.loading::before { transform: scaleX(0); }

    /* Shutter flash */
    .flash {
      position: fixed;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 998;
      transition: opacity 0.05s;
    }
    .flash.active { opacity: 0.6; }

    /* Log */
    .log {
      flex: 1;
      overflow-y: auto;
      font-size: 0.72rem;
      line-height: 1.8;
    }

    .log-entry {
      padding: 0.15rem 0;
      border-bottom: 1px solid #1a1a1a;
      color: var(--dim);
      animation: fadeIn 0.3s ease;
    }

    .log-entry.ok { color: #7dff7d; }
    .log-entry.err { color: var(--accent2); }

    @keyframes fadeIn { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; } }

    /* Counter */
    .counter {
      text-align: center;
      padding: 1rem;
      border: 1px solid var(--border);
    }

    .counter-num {
      font-family: var(--display);
      font-size: 3rem;
      color: #fff;
      line-height: 1;
    }

    .counter-label {
      font-size: 0.65rem;
      color: var(--dim);
      letter-spacing: 0.15em;
    }

    /* ── RIGHT PANEL: VIEWER ── */
    .viewer {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .viewer-header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 0.7rem;
      color: var(--dim);
      letter-spacing: 0.1em;
    }

    .viewer-header .filename {
      margin-left: auto;
      color: var(--accent);
      font-size: 0.75rem;
    }

    .photo-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 50%, #1a1a1a 0%, #0d0d0d 100%);
    }

    .photo-stage::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to right, #0d0d0d 0%, transparent 4%),
        linear-gradient(to left,  #0d0d0d 0%, transparent 4%),
        linear-gradient(to bottom, #0d0d0d 0%, transparent 4%),
        linear-gradient(to top,   #0d0d0d 0%, transparent 4%);
      pointer-events: none;
    }

    .empty-state {
      text-align: center;
      color: var(--dim);
    }

    .empty-state .icon {
      font-size: 4rem;
      margin-bottom: 1rem;
      opacity: 0.3;
    }

    .empty-state p {
      font-size: 0.8rem;
      letter-spacing: 0.15em;
    }

    #mainPhoto {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: none;
      border: 1px solid var(--border);
      box-shadow: 0 0 60px rgba(0,0,0,0.8);
      animation: reveal 0.4s ease;
    }

    @keyframes reveal {
      from { opacity: 0; transform: scale(0.97); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* Thumbnail strip */
    .thumb-strip {
      height: 90px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 1.5rem;
      overflow-x: auto;
      background: var(--panel);
    }

    .thumb-strip::-webkit-scrollbar { height: 4px; }
    .thumb-strip::-webkit-scrollbar-track { background: #111; }
    .thumb-strip::-webkit-scrollbar-thumb { background: var(--border); }

    .thumb {
      height: 70px;
      width: 100px;
      object-fit: cover;
      border: 1px solid var(--border);
      cursor: pointer;
      flex-shrink: 0;
      transition: border-color 0.15s, transform 0.15s;
      filter: brightness(0.7);
    }

    .thumb:hover { border-color: var(--accent); filter: brightness(1); transform: scale(1.04); }
    .thumb.active { border-color: var(--accent); filter: brightness(1); }

    /* Footer */
    footer {
      border-top: 1px solid var(--border);
      padding: 0.6rem 2rem;
      font-size: 0.65rem;
      color: var(--dim);
      letter-spacing: 0.1em;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

<div class="flash" id="flash"></div>

<header>
  <div class="logo">Pi<span>CAM</span></div>
  <div class="status-bar">
    <div class="dot"></div>
    <span>SYSTEM READY</span>
    <span id="clock">--:--:--</span>
  </div>
</header>

<main>
  <!-- Controls -->
  <aside class="controls">
    <div>
      <div class="section-label">Capture</div>
      <button id="captureBtn" onclick="capture()">
        <span id="btnText">⬤ SHOOT</span>
      </button>
    </div>

    <div class="counter">
      <div class="counter-num" id="shotCount">0</div>
      <div class="counter-label">FRAMES CAPTURED</div>
    </div>

    <div style="flex:1; min-height:0; display:flex; flex-direction:column;">
      <div class="section-label">Event Log</div>
      <div class="log" id="log"></div>
    </div>
  </aside>

  <!-- Viewer -->
  <section class="viewer">
    <div class="viewer-header">
      <span>LIVE VIEWER</span>
      <span class="filename" id="currentFile">NO IMAGE</span>
    </div>

    <div class="photo-stage">
      <div class="empty-state" id="emptyState">
        <div class="icon">◎</div>
        <p>PRESS SHOOT TO CAPTURE</p>
      </div>
      <img id="mainPhoto" alt="Captured photo" />
    </div>

    <div class="thumb-strip" id="thumbStrip"></div>
  </section>
</main>

<footer>
  <span>RASPBERRY PI CAMERA INTERFACE</span>
  <span id="resolution">—</span>
</footer>

<script>
  let shotCount = 0;
  const photos = [];

  // Clock
  function tick() {
    const now = new Date();
    document.getElementById('clock').textContent =
      now.toTimeString().slice(0,8);
  }
  setInterval(tick, 1000); tick();

  function log(msg, type = '') {
    const el = document.getElementById('log');
    const entry = document.createElement('div');
    entry.className = 'log-entry ' + type;
    const t = new Date().toTimeString().slice(0,8);
    entry.textContent = `[${t}] ${msg}`;
    el.prepend(entry);
    // Keep max 50 entries
    while (el.children.length > 50) el.removeChild(el.lastChild);
  }

  function flash() {
    const f = document.getElementById('flash');
    f.classList.add('active');
    setTimeout(() => f.classList.remove('active'), 120);
  }

  function showPhoto(filename) {
    const img = document.getElementById('mainPhoto');
    const empty = document.getElementById('emptyState');
    img.src = `/photos/${filename}?t=${Date.now()}`;
    img.style.display = 'block';
    empty.style.display = 'none';
    document.getElementById('currentFile').textContent = filename;

    // Update thumbs
    document.querySelectorAll('.thumb').forEach(t => {
      t.classList.toggle('active', t.dataset.file === filename);
    });
  }

  function addThumb(filename) {
    const strip = document.getElementById('thumbStrip');
    const img = document.createElement('img');
    img.className = 'thumb active';
    img.src = `/photos/${filename}?t=${Date.now()}`;
    img.dataset.file = filename;
    img.title = filename;
    img.onclick = () => showPhoto(filename);
    // Deactivate others
    strip.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
    strip.prepend(img);
  }

  async function capture() {
    const btn = document.getElementById('captureBtn');
    const btnText = document.getElementById('btnText');

    btn.classList.add('loading');
    btnText.textContent = '◌ CAPTURING...';
    log('Shutter triggered');

    try {
      const res = await fetch('/capture', { method: 'POST' });
      const data = await res.json();

      if (data.success) {
        flash();
        shotCount++;
        document.getElementById('shotCount').textContent = shotCount;
        photos.unshift(data.filename);
        addThumb(data.filename);
        showPhoto(data.filename);
        log(`Saved: ${data.filename}`, 'ok');
      } else {
        log(`Error: ${data.error}`, 'err');
      }
    } catch (e) {
      log(`Network error: ${e.message}`, 'err');
    } finally {
      btn.classList.remove('loading');
      btnText.textContent = '⬤ SHOOT';
    }
  }

  // Keyboard shortcut: Space to shoot
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && e.target === document.body) {
      e.preventDefault();
      capture();
    }
  });

  // Load existing photos on startup
  async function loadExisting() {
    try {
      const res = await fetch('/latest');
      const data = await res.json();
      if (data.photos.length > 0) {
        data.photos.forEach(f => photos.push(f));
        data.photos.forEach(f => addThumb(f));
        showPhoto(data.photos[0]);
        shotCount = data.photos.length;
        document.getElementById('shotCount').textContent = shotCount;
        log(`Loaded ${data.photos.length} existing photo(s)`, 'ok');
      }
    } catch(e) {}
  }
  loadExisting();
</script>
</body>
</html>

# RealSense D421 wrapper. Publishes standard depth/IR/image topics and services.
  realsense_camera_thread:
    platform: linux/arm64
    build:
      context: .
      dockerfile: mappingThread-Local/Dockerfile
    container_name: roverpi-realsense_camera_thread
    privileged: true
    network_mode: host
    devices:
      - /dev/bus/usb:/dev/bus/usb
    environment:
      - PYTHONUNBUFFERED=1
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
    command: >
      bash -lc "ros2 launch realsense2_camera rs_launch.py
      camera_namespace:=camera
      camera_name:=camera
      depth_module.depth_profile:=640x480x15
      depth_module.infra_profile:=640x480x15
      enable_depth:=true
      enable_infra1:=true
      enable_infra2:=true
      pointcloud.enable:=true
      spatial_filter.enable:=true
      temporal_filter.enable:=true
      hole_filling_filter.enable:=true"


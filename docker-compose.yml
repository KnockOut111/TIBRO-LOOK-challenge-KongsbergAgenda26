# Remember to fix for virtuel environment and ROS workspace when running the docker container.

services:
  nav_thread:
    build: 
      context: .
      dockerfile: navThread/Dockerfile
    container_name: roverpi-nav_thread
    privileged: true
    devices:
      - /dev/i2c-1:/dev/i2c-1
      - /dev/gpiomem:/dev/gpiomem
      - /dev/mem:/dev/mem
    volumes:
      - ./navThread:/app
    working_dir: /app
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - BLINKA_FORCECHIP=BCM2XXX    
    command: python3 -u mainLogic.py  # Decides what is to run on startup, otherwise it will just run the default command which is to start a bash terminal

  metal_sensor_thread:
    build:
      context: .
      dockerfile: metalSensorThread/Dockerfile
    container_name: roverpi-metal_sensor_thread
    privileged: true
    network_mode: host
    devices:
      - /dev/gpiomem:/dev/gpiomem
    volumes:
      - ./metalSensorThread:/app
    working_dir: /app
    environment:
      - PYTHONUNBUFFERED=1
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
    command: python3 -u metalSensorLogic.py
  
  imu_sensor_thread:
    build:
      context: .
      dockerfile: sensorThread/Dockerfile
    container_name: roverpi-imu_sensor_thread
    privileged: true
    devices:
      - /dev/i2c-1:/dev/i2c-1
      - /dev/gpiomem:/dev/gpiomem
      - /dev/gpiochip0:/dev/gpiochip0

    volumes:
      - ./sensorThread:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - BLINKA_FORCECHIP=BCM2XXX
    command: python3 -u imuSensorLogic.py


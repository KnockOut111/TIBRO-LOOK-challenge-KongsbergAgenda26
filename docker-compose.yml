# Stereo/depth camera thread for obstacle detection and avoidance.
  depth_camera_thread:
    build:
      context: .
      dockerfile: mappingThread-Local/Dockerfile
    container_name: roverpi-depth_camera_thread
    privileged: true
    network_mode: host
    devices:
      - /dev/bus/usb:/dev/bus/usb
    volumes:
      - ./mappingThread-Local/stereocamera:/app
    working_dir: /app
    environment:
      - PYTHONUNBUFFERED=1
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
    command: python3 -u depthCameraNode.py


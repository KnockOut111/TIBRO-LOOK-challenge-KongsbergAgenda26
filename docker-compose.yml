# Remember to fix for virtuel environment and ROS workspace when running the docker container.

services:
  nav_thread:
    platform: linux/arm64
    build: 
      context: .
      dockerfile: navThread/Dockerfile
    container_name: roverpi-nav_thread
    privileged: true
    devices:
      - /dev/i2c-1:/dev/i2c-1
      - /dev/gpiomem:/dev/gpiomem
      - /dev/mem:/dev/mem
    volumes:
      - ./navThread:/app
    working_dir: /app
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - BLINKA_FORCECHIP=BCM2XXX    
    command: python3 -u mainLogic.py  # Decides what is to run on startup, otherwise it will just run the default command which is to start a bash terminal

 
  autonomous_controller_thread:
    build:
      context: .
      dockerfile: navThread/Dockerfile
    container_name: roverpi-autonomous_controller_thread
    network_mode: host
    volumes:
      - ./navThread:/app
    working_dir: /app
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
    command: python3 -u autonomousController_node.py

  metal_sensor_thread:
    platform: linux/arm64
    build:
      context: .
      dockerfile: metalSensorThread/Dockerfile
    container_name: roverpi-metal_sensor_thread
    privileged: true
    network_mode: host
    devices:
      - /dev/gpiomem:/dev/gpiomem
    volumes:
      - ./metalSensorThread:/app
    working_dir: /app
    environment:
      - PYTHONUNBUFFERED=1
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
    command: python3 -u metalSensorLogic.py
  
  imu_sensor_thread:
    platform: linux/arm64
    build:
      context: .
      dockerfile: sensorThread/Dockerfile
    container_name: roverpi-imu_sensor_thread
    privileged: true
    devices:
      - /dev/i2c-1:/dev/i2c-1
      - /dev/gpiomem:/dev/gpiomem
      - /dev/gpiochip0:/dev/gpiochip0

    volumes:
      - ./sensorThread:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - BLINKA_FORCECHIP=BCM2XXX
    command: python3 -u imuSensorLogic.py


  manual_command_thread:
      platform: linux/arm64
      build:
        context: .
        dockerfile: manualCommandThread/Dockerfile
      container_name: roverpi-manual_command_thread
      privileged: true

      volumes:
        - ./manualCommandThread:/app
      environment:
        - PYTHONUNBUFFERED=1
        - PYTHONPATH=/app
        - BLINKA_FORCECHIP=BCM2XXX
      command: python3 -u manualcommands.py
  picam_thread:
    platform: linux/arm64
    build:
      context: .
      dockerfile: picam_server/Dockerfile
    container_name: roverpi-picam_thread
    privileged: true
    network_mode: host
    volumes:
      - ./picam_server:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    command: bash -lc "source /opt/ros/jazzy/setup.bash && python3 -u picamThread.py"


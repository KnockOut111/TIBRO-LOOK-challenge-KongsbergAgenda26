# docker-compose.yml
version: "3.9"

services:
  rover_autonomous:
    build: .
    container_name: rover_autonomous
    restart: unless-stopped

    network_mode: host
    privileged: true

    devices:
      - /dev/i2c-1:/dev/i2c-1
      - /dev/gpiomem:/dev/gpiomem

    environment:
      ROS_DOMAIN_ID: 0
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      PYTHONUNBUFFERED: "1"

    volumes:
      - ./autonomous_simple_node.py:/app/autonomous_simple_node.py:ro

    command: >
      /bin/bash -lc
      "source /opt/ros/humble/setup.bash &&
       python3 /app/autonomous_simple_node.py"